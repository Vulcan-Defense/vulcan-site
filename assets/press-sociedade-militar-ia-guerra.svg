<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Exército Brasileiro discute Inteligência Artificial na guerra</title>
  <desc id="desc">Capa de notícia sobre IA, defesa e decisões militares.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101d31"/>
      <stop offset="55%" stop-color="#091724"/>
      <stop offset="100%" stop-color="#040c13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f6c85f"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".18">
    <path d="M0 560H1200M0 500H1200M0 440H1200M0 380H1200"/>
    <path d="M120 0V675M240 0V675M360 0V675M480 0V675M600 0V675M720 0V675M840 0V675M960 0V675M1080 0V675"/>
  </g>
  <g transform="translate(920 325)" fill="none" stroke="#67e8f9" stroke-opacity=".45">
    <circle r="210"/><circle r="150"/><circle r="90"/><circle r="34" fill="#67e8f9" fill-opacity=".08"/>
    <path d="M-230 0H230M0-230V230M-163-163 163 163M163-163-163 163"/>
    <path d="M0 0 145-95" stroke="#f6c85f" stroke-opacity=".9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="145" cy="-95" r="7" fill="#f6c85f" stroke="none"/>
  </g>
  <rect x="72" y="62" width="320" height="34" rx="17" fill="#f6c85f" fill-opacity=".12" stroke="#f6c85f" stroke-opacity=".35"/>
  <text x="92" y="85" fill="#f6c85f" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="1">NOTÍCIA · SOCIEDADE MILITAR</text>
  <text x="72" y="210" fill="#ffffff" font-family="Arial, sans-serif" font-size="54" font-weight="800">
    <tspan x="72">IA pode transformar</tspan>
    <tspan x="72" dy="64">decisões na guerra</tspan>
  </text>
  <text x="72" y="360" fill="#a8bcc5" font-family="Arial, sans-serif" font-size="28">
    <tspan x="72">Exército Brasileiro reúne coronel,</tspan>
    <tspan x="72" dy="38">empresa e defesa para discutir o tema</tspan>
  </text>
  <rect x="72" y="430" width="170" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="560" fill="#dce8ee" font-family="Arial, sans-serif" font-size="22" font-weight="700">Vulcan Defense na pauta de Defesa e IA</text>
  <text x="72" y="592" fill="#7f949d" font-family="Arial, sans-serif" font-size="18">Novembro 2026</text>
</svg>
